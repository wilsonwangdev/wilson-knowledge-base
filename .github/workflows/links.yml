name: Check Links

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "content/**"
      - "lychee.toml"

jobs:
  links:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --no-progress --root-dir content "./content/**/*.md"
          fail: true
