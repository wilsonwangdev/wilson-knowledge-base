<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>邮件订阅系统架构 — Wilson's Knowledge Base</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'JetBrains Mono', monospace;
      background: #020617; min-height: 100vh; padding: 2rem; color: white;
    }
    .container { max-width: 1100px; margin: 0 auto; }
    .header { margin-bottom: 2rem; }
    .header-row { display: flex; align-items: center; gap: 1rem; margin-bottom: 0.5rem; }
    .pulse-dot { width: 12px; height: 12px; background: #22d3ee; border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    h1 { font-size: 1.4rem; font-weight: 700; }
    .subtitle { color: #94a3b8; font-size: 0.8rem; margin-left: 1.75rem; }
    .diagram-container {
      background: rgba(15,23,42,0.5); border-radius: 1rem; border: 1px solid #1e293b;
      padding: 1.5rem; overflow-x: auto;
    }
    svg { width: 100%; max-width: 100%; display: block; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-row"><div class="pulse-dot"></div><h1>邮件订阅系统架构</h1></div>
    <p class="subtitle">Quartz 静态站点 + follow.it RSS-to-Email 管道</p>
  </div>

  <div class="diagram-container">
    <svg viewBox="0 0 1050 580">
      <defs>
        <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
        </marker>
        <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
        </marker>
        <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
        </marker>
        <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
        </marker>
        <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
        </marker>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
        </pattern>
      </defs>

      <rect width="100%" height="100%" fill="url(#grid)"/>

      <!-- ===== Vercel Cloud Region ===== -->
      <rect x="30" y="30" width="680" height="350" rx="12" fill="rgba(251,191,36,0.04)" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4"/>
      <text x="44" y="50" fill="#fbbf24" font-size="10" font-weight="600">Vercel (HKG)</text>

      <!-- Content: Markdown files (Database color) -->
      <rect x="60" y="70" width="150" height="60" rx="6" fill="rgba(76,29,149,0.35)" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="135" y="95" fill="white" font-size="11" font-weight="600" text-anchor="middle">Content</text>
      <text x="135" y="113" fill="#94a3b8" font-size="8" text-anchor="middle">Markdown 笔记</text>

      <!-- Quartz Build (Backend color) -->
      <rect x="290" y="70" width="150" height="60" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
      <text x="365" y="95" fill="white" font-size="11" font-weight="600" text-anchor="middle">Quartz Build</text>
      <text x="365" y="113" fill="#94a3b8" font-size="8" text-anchor="middle">npx quartz build</text>

      <!-- RSS Feed (also Backend color, inside build pipeline) -->
      <rect x="290" y="170" width="150" height="50" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
      <text x="365" y="190" fill="white" font-size="11" font-weight="600" text-anchor="middle">RSS Feed</text>
      <text x="365" y="206" fill="#94a3b8" font-size="8" text-anchor="middle">index.xml (HTML)</text>

      <!-- SVG Cleaner (small box) -->
      <rect x="290" y="250" width="150" height="40" rx="6" fill="rgba(6,78,59,0.3)" stroke="#34d399" stroke-width="0.8" stroke-dasharray="4,4"/>
      <text x="365" y="274" fill="#94a3b8" font-size="9" text-anchor="middle">strip anchor SVGs</text>

      <!-- Static HTML site (Frontend color) -->
      <rect x="520" y="70" width="160" height="60" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="600" y="90" fill="white" font-size="11" font-weight="600" text-anchor="middle">Static Site</text>
      <text x="600" y="107" fill="#94a3b8" font-size="8" text-anchor="middle">kb.wilsonhandbook.online</text>
      <text x="600" y="121" fill="#22d3ee" font-size="7" text-anchor="middle">Quartz v4 + Slate 主题</text>

      <!-- Subscription Form (Frontend sub) -->
      <rect x="520" y="180" width="160" height="55" rx="6" fill="rgba(8,51,68,0.3)" stroke="#22d3ee" stroke-width="1"/>
      <text x="600" y="200" fill="white" font-size="10" font-weight="600" text-anchor="middle">NewsletterFooter</text>
      <text x="600" y="216" fill="#94a3b8" font-size="8" text-anchor="middle">📬 inline 表单</text>
      <text x="600" y="228" fill="#64748b" font-size="7" text-anchor="middle">POST → follow.it API</text>

      <!-- ===== follow.it External ===== -->
      <rect x="780" y="30" width="230" height="350" rx="12" fill="rgba(30,41,59,0.25)" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6,3"/>
      <text x="794" y="50" fill="#94a3b8" font-size="10" font-weight="600">follow.it</text>

      <!-- follow.it RSS monitoring -->
      <rect x="800" y="70" width="190" height="55" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="895" y="92" fill="white" font-size="11" font-weight="600" text-anchor="middle">RSS Monitor</text>
      <text x="895" y="108" fill="#94a3b8" font-size="8" text-anchor="middle">定时抓取 index.xml</text>
      <text x="895" y="120" fill="#64748b" font-size="7" text-anchor="middle">检测新文章触发</text>

      <!-- follow.it API -->
      <rect x="800" y="160" width="190" height="50" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="895" y="180" fill="white" font-size="11" font-weight="600" text-anchor="middle">Subscription API</text>
      <text x="895" y="196" fill="#94a3b8" font-size="8" text-anchor="middle">POST /subscription-form</text>

      <!-- follow.it Email -->
      <rect x="800" y="245" width="190" height="55" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="895" y="267" fill="white" font-size="11" font-weight="600" text-anchor="middle">Email Delivery</text>
      <text x="895" y="283" fill="#94a3b8" font-size="8" text-anchor="middle">HTML 邮件推送</text>
      <text x="895" y="295" fill="#64748b" font-size="7" text-anchor="middle">含正文 + 原文链接</text>

      <!-- Landing page -->
      <rect x="800" y="330" width="190" height="35" rx="6" fill="rgba(30,41,59,0.3)" stroke="#94a3b8" stroke-width="0.8"/>
      <text x="895" y="352" fill="#94a3b8" font-size="9" text-anchor="middle">Landing Page (备选)</text>

      <!-- ===== Subscribers ===== -->
      <rect x="800" y="430" width="190" height="50" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="895" y="450" fill="white" font-size="11" font-weight="600" text-anchor="middle">Subscribers</text>
      <text x="895" y="466" fill="#94a3b8" font-size="8" text-anchor="middle">📧 邮箱列表</text>

      <!-- ===== Visitor ===== -->
      <rect x="60" y="430" width="140" height="50" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="130" y="450" fill="white" font-size="11" font-weight="600" text-anchor="middle">Visitor</text>
      <text x="130" y="466" fill="#94a3b8" font-size="8" text-anchor="middle">🖥️ 浏览站点</text>

      <!-- ===== ARROWS ===== -->

      <!-- Content → Quartz Build -->
      <line x1="210" y1="100" x2="288" y2="100" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
      <text x="249" y="94" fill="#94a3b8" font-size="8" text-anchor="middle">parsed</text>

      <!-- Quartz Build → Static Site -->
      <line x1="440" y1="100" x2="518" y2="100" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
      <text x="479" y="94" fill="#94a3b8" font-size="8" text-anchor="middle">emit</text>

      <!-- Quartz Build → RSS Feed -->
      <line x1="365" y1="130" x2="365" y2="168" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>

      <!-- RSS Feed → SVG Cleaner -->
      <line x1="365" y1="220" x2="365" y2="248" stroke="#34d399" stroke-width="1" marker-end="url(#arrow-emerald)"/>

      <!-- SVG Cleaner → follow.it RSS Monitor -->
      <path d="M 440 270 L 770 270 Q 780 270 780 260 L 780 100 L 798 100" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
      <text x="620" y="262" fill="#94a3b8" font-size="8" text-anchor="middle">RSS polling</text>

      <!-- follow.it RSS → Email Delivery -->
      <line x1="895" y1="125" x2="895" y2="243" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Email Delivery → Subscribers -->
      <line x1="895" y1="300" x2="895" y2="428" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Visitor → Static Site -->
      <line x1="200" y1="455" x2="518" y2="150" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
      <text x="380" y="350" fill="#94a3b8" font-size="8">visit</text>

      <!-- Static Site → NewsletterFooter (internal) -->
      <line x1="600" y1="130" x2="600" y2="178" stroke="#22d3ee" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- NewsletterFooter → follow.it API -->
      <line x1="680" y1="207" x2="798" y2="185" stroke="#22d3ee" stroke-width="1.2" marker-end="url(#arrow-cyan)"/>
      <text x="745" y="199" fill="#94a3b8" font-size="7">POST</text>

      <!-- follow.it API → Email Delivery (internal) -->
      <line x1="895" y1="210" x2="895" y2="243" stroke="#94a3b8" stroke-width="1"/>

      <!-- ===== LEGEND ===== -->
      <text x="60" y="545" fill="white" font-size="10" font-weight="600">Legend</text>

      <rect x="60" y="555" width="14" height="9" rx="2" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1"/>
      <text x="80" y="563" fill="#94a3b8" font-size="8">Frontend</text>

      <rect x="160" y="555" width="14" height="9" rx="2" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1"/>
      <text x="180" y="563" fill="#94a3b8" font-size="8">Build Pipeline</text>

      <rect x="310" y="555" width="14" height="9" rx="2" fill="rgba(76,29,149,0.35)" stroke="#a78bfa" stroke-width="1"/>
      <text x="330" y="563" fill="#94a3b8" font-size="8">Content</text>

      <rect x="420" y="555" width="14" height="9" rx="2" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1"/>
      <text x="440" y="563" fill="#94a3b8" font-size="8">Hosting</text>

      <rect x="530" y="555" width="14" height="9" rx="2" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1"/>
      <text x="550" y="563" fill="#94a3b8" font-size="8">External Service</text>

      <line x1="650" y1="561" x2="664" y2="561" stroke="#22d3ee" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="670" y="563" fill="#94a3b8" font-size="8">Subscribe Flow</text>
    </svg>
  </div>

</div>
</body>
</html>
