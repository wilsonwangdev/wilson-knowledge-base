<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RSS 生成管线架构图 — Wilson's Knowledge Base</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'JetBrains Mono', monospace;
      background: #020617; min-height: 100vh; padding: 2rem; color: white;
    }
    .container { max-width: 1100px; margin: 0 auto; }
    .header { margin-bottom: 2rem; }
    .header-row { display: flex; align-items: center; gap: 1rem; margin-bottom: 0.5rem; }
    .pulse-dot { width: 12px; height: 12px; background: #22d3ee; border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    h1 { font-size: 1.4rem; font-weight: 700; }
    .subtitle { color: #94a3b8; font-size: 0.8rem; margin-left: 1.75rem; }
    .diagram-container {
      background: rgba(15,23,42,0.5); border-radius: 1rem; border: 1px solid #1e293b;
      padding: 1.5rem;
    }
    svg { width: 100%; max-width: 100%; display: block; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-row"><div class="pulse-dot"></div><h1>RSS 生成管线</h1></div>
    <p class="subtitle">ContentIndex 插件 · cleanHtml 定制清洗 · follow.it 消费</p>
  </div>

  <div class="diagram-container">
    <svg viewBox="0 0 1000 500">
      <defs>
        <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
        </marker>
        <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
        </marker>
        <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
        </marker>
        <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
          <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
        </marker>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
        </pattern>
      </defs>

      <rect width="100%" height="100%" fill="url(#grid)"/>

      <rect x="20" y="20" width="640" height="440" rx="12" fill="rgba(6,78,59,0.04)" stroke="#34d399" stroke-width="1" stroke-dasharray="8,4"/>
      <text x="34" y="40" fill="#34d399" font-size="10" font-weight="600">Quartz 内置 — ContentIndex 插件</text>

      <rect x="45" y="65" width="140" height="50" rx="6" fill="rgba(76,29,149,0.35)" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="115" y="86" fill="white" font-size="11" font-weight="600" text-anchor="middle">content/*.md</text>
      <text x="115" y="103" fill="#94a3b8" font-size="8" text-anchor="middle">Markdown + Frontmatter</text>

      <rect x="220" y="65" width="140" height="50" rx="6" fill="rgba(6,78,59,0.35)" stroke="#34d399" stroke-width="1.5"/>
      <text x="290" y="86" fill="white" font-size="11" font-weight="600" text-anchor="middle">Transformers</text>
      <text x="290" y="103" fill="#94a3b8" font-size="8" text-anchor="middle">remark → rehype → hast</text>

      <rect x="395" y="65" width="140" height="50" rx="6" fill="rgba(6,78,59,0.35)" stroke="#34d399" stroke-width="1.5"/>
      <text x="465" y="86" fill="white" font-size="11" font-weight="600" text-anchor="middle">ContentIndex</text>
      <text x="465" y="103" fill="#94a3b8" font-size="8" text-anchor="middle">Emitter (内置)</text>

      <rect x="45" y="155" width="590" height="200" rx="8" fill="rgba(6,78,59,0.05)" stroke="#34d399" stroke-width="0.8" stroke-dasharray="4,4"/>

      <rect x="65" y="175" width="180" height="50" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
      <text x="155" y="197" fill="white" font-size="11" font-weight="600" text-anchor="middle">① toHtml()</text>
      <text x="155" y="214" fill="#94a3b8" font-size="8" text-anchor="middle">hast → 原始 HTML（含锚点 SVG）</text>

      <line x1="245" y1="200" x2="280" y2="200" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>

      <rect x="290" y="175" width="180" height="50" rx="6" fill="rgba(251,191,36,0.25)" stroke="#fbbf24" stroke-width="1.8"/>
      <text x="380" y="190" fill="#fbbf24" font-size="10" font-weight="600" text-anchor="middle">★ ② cleanHtml() 定制</text>
      <text x="380" y="211" fill="#94a3b8" font-size="8" text-anchor="middle">正则剥除 &lt;a role="anchor"&gt; SVG</text>

      <line x1="470" y1="200" x2="505" y2="200" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>

      <rect x="515" y="175" width="100" height="50" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
      <text x="565" y="197" fill="white" font-size="11" font-weight="600" text-anchor="middle">③ escape</text>
      <text x="565" y="214" fill="#94a3b8" font-size="8" text-anchor="middle">XML 安全编码</text>

      <rect x="250" y="270" width="200" height="40" rx="6" fill="rgba(34,211,238,0.2)" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="350" y="294" fill="white" font-size="11" font-weight="600" text-anchor="middle">public/index.xml</text>

      <line x1="565" y1="225" x2="565" y2="255" stroke="#34d399" stroke-width="1.5"/>
      <line x1="350" y1="255" x2="565" y2="255" stroke="#34d399" stroke-width="1.5"/>
      <line x1="350" y1="255" x2="350" y2="268" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>

      <rect x="700" y="20" width="270" height="440" rx="12" fill="rgba(251,191,36,0.04)" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4"/>
      <text x="714" y="40" fill="#fbbf24" font-size="10" font-weight="600">部署 & 消费</text>

      <rect x="720" y="65" width="230" height="50" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
      <text x="835" y="86" fill="white" font-size="11" font-weight="600" text-anchor="middle">Vercel (HKG)</text>
      <text x="835" y="103" fill="#94a3b8" font-size="8" text-anchor="middle">静态托管 · kb.wilsonhandbook.online</text>

      <rect x="720" y="145" width="230" height="50" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="835" y="166" fill="white" font-size="11" font-weight="600" text-anchor="middle">RSS Reader</text>
      <text x="835" y="183" fill="#94a3b8" font-size="8" text-anchor="middle">Feedly · NetNewsWire · …</text>

      <rect x="720" y="225" width="230" height="70" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="835" y="248" fill="white" font-size="11" font-weight="600" text-anchor="middle">follow.it</text>
      <text x="835" y="265" fill="#94a3b8" font-size="8" text-anchor="middle">定时抓取 RSS → 邮件群发</text>
      <text x="835" y="280" fill="#94a3b8" font-size="8" text-anchor="middle">订阅管理 · 退订 · 分析</text>

      <rect x="720" y="330" width="230" height="50" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="835" y="351" fill="white" font-size="11" font-weight="600" text-anchor="middle">📧 订阅者邮箱</text>
      <text x="835" y="368" fill="#94a3b8" font-size="8" text-anchor="middle">HTML 邮件 · 正文 + 原文链接</text>

      <line x1="185" y1="92" x2="218" y2="92" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow)"/>
      <line x1="360" y1="92" x2="393" y2="92" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>

      <path d="M 400 320 L 690 320 Q 700 320 700 310 L 700 92 L 718 92" fill="none" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
      <text x="590" y="313" fill="#94a3b8" font-size="8">deploy</text>

      <line x1="835" y1="115" x2="835" y2="143" stroke="#fbbf24" stroke-width="1.2" marker-end="url(#arrow-amber)"/>
      <text x="847" y="133" fill="#94a3b8" font-size="7">GET index.xml</text>

      <path d="M 740 115 L 740 130 Q 740 140 750 140 L 760 140 L 760 223" fill="none" stroke="#fbbf24" stroke-width="1.2" marker-end="url(#arrow-amber)"/>
      <text x="772" y="180" fill="#94a3b8" font-size="7">RSS polling</text>

      <line x1="835" y1="295" x2="835" y2="328" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="20" y="472" width="14" height="9" rx="2" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1"/>
      <text x="40" y="480" fill="#94a3b8" font-size="8">Quartz 内置</text>
      <rect x="130" y="472" width="14" height="9" rx="2" fill="rgba(251,191,36,0.25)" stroke="#fbbf24" stroke-width="1"/>
      <text x="150" y="480" fill="#94a3b8" font-size="8">★ 定制扩展</text>
      <rect x="250" y="472" width="14" height="9" rx="2" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1"/>
      <text x="270" y="480" fill="#94a3b8" font-size="8">外部服务</text>
    </svg>
  </div>
</div>
</body>
</html>
